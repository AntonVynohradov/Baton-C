name: Google Unit Tests

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Google Test and gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev gcovr

      - name: Configure (UnitTests preset)
        run: cmake --preset "BATON[UnitTests]" -B "build/BATON[UnitTests]"

      - name: Build (coverage)
        run: cmake --build "build/BATON[UnitTests]" --target coverage

      - name: Test
        run: ctest --test-dir "build/BATON[UnitTests]" --output-on-failure

      - name: Bus simulation, 100 seeds, ASan + UBSan
        run: |
          cmake --preset "BATON[Sanitize]" -B "build/BATON[Sanitize]"
          cmake --build "build/BATON[Sanitize]" --target baton_sim
          sh tests/run_seeds.sh "build/BATON[Sanitize]" 100

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/BATON\[UnitTests\]/Coverage
