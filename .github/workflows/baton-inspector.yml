name: Baton Inspector

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  inspector-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install --upgrade pip pytest -r tools/baton_inspector/requirements.txt

      - name: Tool tests (API headless, native bridge, simulation, serial loopback)
        run: python -m pytest tools/baton_inspector/tests -v -p no:cacheprovider --junitxml=inspector-tests.xml

      - name: Example system test suite (simulation)
        env:
          BATON_RESULTS: test-results
        run: python -m pytest tools/baton_inspector/examples -v -p no:cacheprovider

      - name: GUI smoke test (offscreen, simulation)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/baton_inspector/screenshots.py gui-smoke

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baton-inspector-results
          path: |
            inspector-tests.xml
            test-results
            gui-smoke
