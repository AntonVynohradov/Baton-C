name: Check Building Static Library

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure (Debug preset)
        run: cmake --preset "BATON[Debug]" -B "build/BATON[Debug]"

      - name: Build
        run: cmake --build "build/BATON[Debug]"

      - name: Configure (Release preset)
        run: cmake --preset "BATON[Release]" -B "build/BATON[Release]"

      - name: Build
        run: cmake --build "build/BATON[Release]"

      - name: Configure (Examples preset)
        run: cmake --preset "BATON[Examples]" -B "build/BATON[Examples]"

      - name: Build examples
        run: cmake --build "build/BATON[Examples]"

      - name: Run bare-metal example on the simulated board
        run: ctest --test-dir "build/BATON[Examples]" -L example --output-on-failure
