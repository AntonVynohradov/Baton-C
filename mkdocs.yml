# MkDocs configuration of Baton-C (SystemFromScratch® protocol library layout).

site_name: Baton-C
site_description: >-
  Deterministic master/slave messaging over a single-wire UART in portable C for embedded
  systems: exactly-once events, latest-value states, no heap, no RTOS, MISRA C:2012,
  100 % test coverage.
site_author: Anton Vynohradov
site_url: https://antonvynohradov.github.io/Baton-C/
repo_url: https://github.com/AntonVynohradov/Baton-C
repo_name: AntonVynohradov/Baton-C
edit_uri: ""
copyright: >-
  Copyright &copy; 2026 Anton Vynohradov ·
  <a href="https://systemfromscratch.com">SystemFromScratch®</a> ·
  Licensed under the <a href="https://www.apache.org/licenses/LICENSE-2.0">Apache License 2.0</a>

nav:
  - Home: index.md
  - Guide:
      - Introduction: overview.md
      - Getting Started: guide.md
      - How It Works: architecture.md
      - Using the Library: usage.md
      - Extending the Library: extending.md
      - Configuration: configuration.md
  - Protocol: protocol.md
  - Integration:
      - Integration Guide: integration.md
      - Examples: examples.md
      - Baton Inspector: inspector.md
  - Reference:
      - API Reference: api.md
      - Doxygen:
          - Modules: reference/modules.md
          - Files: reference/files.md
          - Data Structures: reference/annotated.md
          - Functions: reference/functions.md
          - Macros: reference/macros.md
      - MISRA C:2012: misra.md
      - Changelog: changelog.md
  - About:
      - Author & Company: about.md
      - License: LICENSE.md

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/brand/systemfromscratch-logo-on-dark.png
  favicon: assets/images/brand/systemfromscratch-logo.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra:
  generator: false
  # Header download button (overrides/partials/header.html); the PDF is built by CI
  manual_pdf: downloads/Baton-C_User_Manual.pdf
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AntonVynohradov
      name: Anton Vynohradov on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/vynohradov
      name: Anton Vynohradov on LinkedIn
    - icon: material/web
      link: https://systemfromscratch.com
      name: SystemFromScratch®

  # ---------------------------------------------------------------- landing page
  # Rendered by overrides/home.html. Story: hero -> the problem (3 problem->solution
  # cards) -> what you get (6 linked cards) -> measured stats -> quick start
  # (docs/index.md) -> SystemFromScratch® portfolio banner. See references/website.md.
  landing:
    eyebrow: Open-source embedded library
    title: One wire, many MCUs               # first hero line (uppercase via CSS)
    accent: no lost messages                 # second hero line, accent color
    lead: >-
      Baton-C turns a single shared UART line into a deterministic bus: the master passes
      the baton, events arrive exactly once and in order, states always reach their
      latest value — with no heap, no RTOS and code that passes MISRA C:2012.
    hero_image: assets/images/hero-3d.svg
    hero_alt: >-
      A circuit board with the Baton-C chip drives one wire to three slave modules
      (0x11, 0x12, 0x13); a request travels to a slave and its answer comes back while
      noise falls off the line.
    buttons:
      - {text: Get started, link: guide/, style: primary}
      - {text: View on GitHub, link: "https://github.com/AntonVynohradov/Baton-C", style: outline}
    features:
      - {icon: chip, line1: No heap, line2: No RTOS}
      - {icon: shield, line1: MISRA C:2012, line2: 0 violations}
      - {icon: flask, line1: 100 % line &, line2: branch coverage}
      - {icon: code, line1: Apache-2.0, line2: open source}
    problem:
      eyebrow: The problem
      title: One shared wire, no second chance
      intro: >-
        A few microcontrollers share one UART line at 9600 bit/s. Two talking at once
        destroy each other's bytes, noise flips bits, a board is unplugged in the field —
        and a lost "stop" command is a bug report. The firmware has a few kilobytes of RAM,
        no operating system to lean on, and code that has to pass a review.
      cards:
        - icon: wave
          title: Collisions, noise and dead nodes
          text: >-
            The master passes the baton: only the polled node transmits, for a bounded
            slot. CRC-16, acknowledgements, retries and duplicate filtering deliver every
            event exactly once; an unreachable node cannot eat the time of the others.
          tags: [Token schedule, CRC-16, Stop-and-wait]
        - icon: memory
          title: Tight embedded budgets
          text: >-
            1696 B of RAM per node with the default sizes and 280 B of worst-case stack on
            Cortex-M4; no allocation, no globals, no OS, no clock reads.
          tags: [Static memory, Bare metal, Zephyr]
        - icon: shield
          title: Code you can certify
          text: >-
            Zero MISRA C:2012 violations, a documented deviation register, 100 % line
            and branch coverage and static analysis in CI.
          tags: [MISRA C, Cppcheck, CodeQL]
    offer:
      eyebrow: What you get
      title: A small library with a clear job
      intro: >-
        A codec, a half-duplex link, an event queue and a node layer — eight functions for
        the application, the rest public for tools.
      cards:
        - {icon: layers, title: Node, link and codec, text: "Master and slave state machines, reliable events and states on top of a byte-level link and a frame codec.", tags: [baton_node, baton_link, baton_protocol], link: architecture/}
        - {icon: plug, title: Any UART wiring, text: "Single wire with echo check, open drain or RS-485: one non-blocking write function and one interrupt call.", tags: [UART, RS-485], link: integration/}
        - {icon: brackets, title: Working examples, text: "A bare-metal slave that runs as a test on a simulated bus, a PC serial master and a Zephyr slave.", tags: [Bare metal, Zephyr, Host], link: examples/}
        - {icon: monitor, title: Baton Inspector, text: "A GUI and Python API: master, monitor or simulation, live sequence diagram with timing, timing rules, field decoding and session logs for automated tests.", tags: [GUI, pytest, JSON Lines], link: inspector/}
        - {icon: document, title: Complete documentation, text: "Protocol specification, guides, measured footprint and stack, API reference and a printable manual.", tags: [API, Guides, PDF], link: protocol/}
        - {icon: check, title: Quality gates in CI, text: "100 % line and branch coverage, a C/Python cross-check, MISRA C:2012 and format checks on every pull request.", tags: [GoogleTest, pytest, Coverage], link: misra/}
    stats:                                   # measured values only
      - {value: "8", label: application functions}
      - {value: "1696 B", label: RAM per node}
      - {value: "280 B", label: stack on Cortex-M4}
      - {value: "0", label: MISRA C:2012 violations}
    portfolio:
      title: Part of an open-source embedded portfolio
      text: >-
        Baton-C is developed by Anton Vynohradov under SystemFromScratch® — embedded
        software and hardware built from the first schematic to certification.
      buttons:
        - {text: SystemFromScratch®, link: "https://systemfromscratch.com", style: primary}
        - {text: About the author, link: about/, style: outline}
    trademark: >-
      SystemFromScratch® is a registered trademark. The Apache License 2.0 grants no rights
      to use the SystemFromScratch® name or logo.

  # ---------------------------------------------------------------- PDF manual
  # Read by tools/docs/build_manual.py. See references/pdf-manual.md.
  manual:
    title: Baton-C
    subtitle: Deterministic Master/Slave Messaging over a Single-Wire UART
    version_header: baton.h
    version_macro: BATON_VERSION
    output: build/manual/Baton-C_User_Manual_v{version}.pdf
    eyebrow: Open-source embedded library
    cover_image: assets/images/hero-3d.svg
    appendices: [changelog.md, LICENSE.md]
    unnumbered: [about.md]
    web_only: [index.md, reference/]
    keywords: UART, single wire, master/slave, embedded, C, MISRA C:2012

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search
  - autorefs
  - mkdoxy:
      projects:
        reference:
          src-dirs: baton.h inc src
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.c *.h"
            RECURSIVE: True
            EXTRACT_STATIC: True
            JAVADOC_AUTOBRIEF: True

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
