<text x="440.0" y="118" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">1 byte</text>
<text x="640.0" y="118" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">0 … 64 bytes</text>
<text x="870.0" y="118" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">2 bytes, big endian</text>
<path d="M490,142 L490,150 L790,150 L790,142" stroke="#1E5AA8" stroke-width="1.6" fill="none"/>
