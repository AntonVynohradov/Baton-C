<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" role="img" aria-label="Baton bus topology">
<title>Baton bus topology</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6472"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F8B9A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07A00"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker></defs>
<rect x="0" y="0" width="980" height="380" rx="12" fill="#FFFFFF"/>
<rect x="20" y="120" width="200" height="130" rx="12" fill="#0B2545" stroke="#0B2545" stroke-width="1.5"/>
<text x="120" y="160" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Master 0x01</text>
<text x="120" y="184" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="normal" fill="#C9D6EA" text-anchor="middle">MCU or PC</text>
<text x="120" y="206" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="normal" fill="#C9D6EA" text-anchor="middle">Baton-C + UART</text>
<text x="120" y="228" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#C9D6EA" text-anchor="middle">polls the slaves in turn</text>
<line x1="220" y1="170" x2="940" y2="170" stroke="#0F8B9A" stroke-width="3"/>
<text x="232" y="188" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#5A6472" text-anchor="start">single wire (UART half duplex) · GND</text>
<line x1="400" y1="170" x2="400" y2="260" stroke="#0F8B9A" stroke-width="2"/>
<rect x="340" y="260" width="120" height="90" rx="10" fill="#F2F5FA" stroke="#1E5AA8" stroke-width="1.5"/>
<text x="400" y="296" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B2545" text-anchor="middle">Slave 0x11</text>
<text x="400" y="318" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">MCU + Baton-C</text>
<text x="400" y="336" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">node index 1</text>
<line x1="600" y1="170" x2="600" y2="260" stroke="#0F8B9A" stroke-width="2"/>
<rect x="540" y="260" width="120" height="90" rx="10" fill="#F2F5FA" stroke="#1E5AA8" stroke-width="1.5"/>
<text x="600" y="296" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B2545" text-anchor="middle">Slave 0x12</text>
<text x="600" y="318" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">MCU + Baton-C</text>
<text x="600" y="336" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">node index 2</text>
<line x1="800" y1="170" x2="800" y2="260" stroke="#0F8B9A" stroke-width="2"/>
<rect x="740" y="260" width="120" height="90" rx="10" fill="#F2F5FA" stroke="#1E5AA8" stroke-width="1.5"/>
<text x="800" y="296" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B2545" text-anchor="middle">Slave 0x13</text>
<text x="800" y="318" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">MCU + Baton-C</text>
<text x="800" y="336" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">node index 3</text>
<rect x="250" y="62" width="200" height="38" rx="6" fill="#FFFFFF" stroke="#E07A00" stroke-width="1.5"/>
<text x="350" y="86" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#E07A00" text-anchor="middle">POLL → 0x12 (baton)</text>
<line x1="250" y1="130" x2="590" y2="130" stroke="#E07A00" stroke-width="2.4" marker-end="url(#arrow-orange)"/>
<rect x="470" y="62" width="220" height="38" rx="6" fill="#FFFFFF" stroke="#1E5AA8" stroke-width="1.5"/>
<text x="580" y="86" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1E5AA8" text-anchor="middle">DATA 0x12 → 0x13, ACK</text>
<line x1="610" y1="140" x2="790" y2="140" stroke="#1E5AA8" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="710" y="62" width="240" height="38" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
<text x="830" y="86" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#2E7D32" text-anchor="middle">RESP 0x12 → master</text>
<line x1="600" y1="150" x2="240" y2="150" stroke="#2E7D32" stroke-width="2.4" marker-end="url(#arrow-green)"/>
<text x="490" y="30" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5A6472" text-anchor="middle">Only the node holding the baton transmits: no arbitration, no collisions, a bounded cycle.</text>
</svg>
