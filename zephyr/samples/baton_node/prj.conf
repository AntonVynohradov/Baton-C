# The message lists of the example bus, shared with the host examples
# (examples/host_serial is a PC master for this sample).
CONFIG_BATON_USER_CONFIG_DIR="../../../examples/config"

# Baton times its gaps and timeouts in milliseconds.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_BATON_LOG_LEVEL_INF=y

# Baton allocates nothing.
CONFIG_HEAP_MEM_POOL_SIZE=0
